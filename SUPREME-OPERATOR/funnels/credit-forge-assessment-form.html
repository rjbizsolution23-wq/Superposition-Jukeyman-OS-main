<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Forge — Free Credit Score Assessment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:40px 20px}
.hero{text-align:center;padding:60px 0 40px}
.hero h1{font-size:42px;font-weight:800;background:linear-gradient(135deg,#00d4aa,#00b894);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.hero p{color:#888;font-size:18px}
.form-card{background:#141414;border:1px solid #222;border-radius:16px;padding:40px;margin:20px 0}
.form-card h2{font-size:24px;margin-bottom:8px;color:#00d4aa}
.form-card .subtitle{color:#666;margin-bottom:30px;font-size:14px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:6px;font-size:14px;color:#aaa;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:14px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:15px;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#00d4aa}
.form-group textarea{min-height:100px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.checkbox-group{display:flex;align-items:flex-start;gap:12px}
.checkbox-group input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:#00d4aa}
.checkbox-group label{font-size:13px;color:#888;margin:0}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#00d4aa,#00b894);color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,170,.3)}
.trust{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;color:#555;font-size:12px}
.trust svg{width:16px;height:16px;fill:#00d4aa}
@media(max-width:480px){.form-row{grid-template-columns:1fr}.hero h1{font-size:32px}.form-card{padding:24px}}
</style>
</head>
<body>
<div class="container">
<div class="hero">
  <h1>CREDIT FORGE</h1>
  <p>RJ Business Solutions — Professional Credit Repair</p>
</div>

<div class="form-card">
  <h2>Free Credit Score Assessment</h2>
  <p class="subtitle">Get a free analysis of your credit report. No obligation, no upfront fees.</p>

  <form id="leadForm">
    <div class="form-row">
      <div class="form-group">
        <label>First Name *</label>
        <input type="text" name="firstName" required placeholder="John">
      </div>
      <div class="form-group">
        <label>Last Name *</label>
        <input type="text" name="lastName" required placeholder="Smith">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" name="email" required placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" name="phone" required placeholder="+1 (555) 123-4567">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>State *</label>
        <select name="state" required>
          <option value="">Select your state</option>
          <option value="CA">California</option><option value="TX">Texas</option>
          <option value="FL">Florida</option><option value="NY">New York</option>
          <option value="IL">Illinois</option><option value="PA">Pennsylvania</option>
          <option value="OH">Ohio</option><option value="GA">Georgia</option>
          <option value="NC">North Carolina</option><option value="MI">Michigan</option>
          <option value="NJ">New Jersey</option><option value="VA">Virginia</option>
          <option value="WA">Washington</option><option value="AZ">Arizona</option>
          <option value="MA">Massachusetts</option><option value="TN">Tennessee</option>
          <option value="IN">Indiana</option><option value="MO">Missouri</option>
          <option value="MD">Maryland</option><option value="WI">Wisconsin</option>
          <option value="CO">Colorado</option><option value="MN">Minnesota</option>
          <option value="SC">South Carolina</option><option value="AL">Alabama</option>
          <option value="LA">Louisiana</option><option value="KY">Kentucky</option>
          <option value="OR">Oregon</option><option value="OK">Oklahoma</option>
          <option value="CT">Connecticut</option><option value="UT">Utah</option>
          <option value="IA">Iowa</option><option value="NV">Nevada</option>
          <option value="AR">Arkansas</option><option value="MS">Mississippi</option>
          <option value="KS">Kansas</option><option value="NM">New Mexico</option>
          <option value="NE">Nebraska</option><option value="WV">West Virginia</option>
          <option value="ID">Idaho</option><option value="HI">Hawaii</option>
          <option value="NH">New Hampshire</option><option value="ME">Maine</option>
          <option value="MT">Montana</option><option value="RI">Rhode Island</option>
          <option value="DE">Delaware</option><option value="SD">South Dakota</option>
          <option value="ND">North Dakota</option><option value="AK">Alaska</option>
          <option value="VT">Vermont</option><option value="WY">Wyoming</option>
          <option value="DC">District of Columbia</option>
        </select>
      </div>
      <div class="form-group">
        <label>Approx. Credit Score (optional)</label>
        <input type="number" name="creditScore" placeholder="e.g. 580" min="300" max="850">
      </div>
    </div>

    <div class="form-group">
      <label>Service Package *</label>
      <select name="servicePackage" required>
        <option value="">Select a package</option>
        <option value="Premium Package — $997/mo">Premium Package — $997/mo (Full Service)</option>
        <option value="Basic Package — $497/mo">Basic Package — $497/mo (Essential Service)</option>
      </select>
    </div>

    <div class="form-group">
      <label>What credit issues are you facing? (optional)</label>
      <textarea name="creditIssues" placeholder="e.g. Late payments, collections, charge-offs, incorrect information..."></textarea>
    </div>

    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" name="consent" id="consent" required>
        <label for="consent">I agree to receive communications from Credit Forge / RJ Business Solutions. I understand this is not a loan and results are not guaranteed. I can unsubscribe at any time.</label>
      </div>
    </div>

    <button type="submit" class="btn">Get My Free Assessment →</button>

    <div class="trust">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      <span>Your information is secure and will never be sold</span>
    </div>
  </form>
</div>
</div>

<script>
document.getElementById('leadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = this.querySelector('.btn');
  btn.textContent = 'Submitting...';
  btn.disabled = true;
  // GHL form submission will be handled by the GHL form embed
  // This is the standalone version for reference
  setTimeout(() => {
    btn.textContent = '✓ Submitted! We\'ll contact you within 24 hours.';
    btn.style.background = '#00d4aa';
  }, 1500);
});
</script>
</body>
</html>
