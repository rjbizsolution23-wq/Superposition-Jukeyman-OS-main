<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Forge — Book Free Consultation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
.container{max-width:600px;margin:0 auto;padding:40px 20px}
.hero{text-align:center;padding:40px 0 30px}
.hero h1{font-size:36px;font-weight:800;background:linear-gradient(135deg,#00d4aa,#00b894);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.hero p{color:#888;font-size:16px}
.form-card{background:#141414;border:1px solid #222;border-radius:16px;padding:40px;margin:20px 0}
.form-card h2{font-size:22px;margin-bottom:6px;color:#00d4aa}
.form-card .subtitle{color:#666;margin-bottom:24px;font-size:14px}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;color:#aaa;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:14px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:15px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#00d4aa}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#00d4aa,#00b894);color:#0a0a0a;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
@media(max-width:480px){.form-row{grid-template-columns:1fr}.form-card{padding:24px}}
</style>
</head>
<body>
<div class="container">
<div class="hero">
  <h1>Book Your Free Consultation</h1>
  <p>Speak with a credit specialist. No obligation, no pressure.</p>
</div>
<div class="form-card">
  <h2>Schedule a Call</h2>
  <p class="subtitle">Pick a time that works best for you. We'll call you.</p>
  <form>
    <div class="form-row">
      <div class="form-group"><label>First Name *</label><input type="text" name="firstName" required></div>
      <div class="form-group"><label>Last Name *</label><input type="text" name="lastName" required></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required></div>
    </div>
    <div class="form-group"><label>Preferred Call Time *</label>
      <select name="preferredTime" required>
        <option value="">Select preferred time</option>
        <option>Morning (9am-12pm)</option>
        <option>Afternoon (12pm-5pm)</option>
        <option>Evening (5pm-8pm)</option>
      </select>
    </div>
    <div class="form-group"><label>Biggest Credit Concern</label>
      <textarea name="concerns" rows="3" placeholder="Tell us about your credit situation..."></textarea>
    </div>
    <button type="submit" class="btn">Book My Free Call →</button>
  </form>
</div>
</div>
</body>
</html>
